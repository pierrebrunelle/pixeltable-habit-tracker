[project]
name = "pixeltable-habit-tracker"
version = "0.1.0"
description = "Habit tracker API with streak labels as computed columns, deployable to Pixeltable Cloud - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "fastapi", "computed-columns", "data-infrastructure", "habit-tracker"]
dependencies = [
    "pixeltable[serve]>=0.7.14",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
